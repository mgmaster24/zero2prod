[package]
name = "zero2prod"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.12.1"
chrono = "0.4.43"
claims = "0.8.0"
config = "0.15.19"
once_cell = "1.21.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "rt"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.21"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
unicode-segmentation = "1.12.0"
validator = { version = "0.20.0", features = ["derive"] }

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
]

[dependencies.tracing-subscriber]
version = "0.3.22"
features = ["registry", "env-filter"]

[dependencies.uuid]
version = "1.20.0"
features = ["v4"]

[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = ["json", "rustls"]


[dev-dependencies]
fake = "~2.3"
quickcheck = "0.9.2"
quickcheck_macros = "0.9.1"
wiremock = "0.6.5"
